add_newline = true
command_timeout = 200
format = "[$jobs$hostname$cmd_duration$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold cyan)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_visual_symbol = "[❮](bold purple)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[cmd_duration]
format = "[$duration](bold green) "
min_time = 1_000

[hostname]
ssh_only = true
format = '[$ssh_symbol$hostname] - ($style)'

[jobs]
format = '[\[$symbol$number\] ]($style)'
