# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=desc:Sharp Corporation 0x14F9,preferred,auto,1
#monitor=desc:Ancor Communications Inc ASUS PB287Q 0x00010077,preferred,auto,1.67,transform,3
#monitor=desc:Dell Inc. DELL U2717D 67YGV685ACVL,1920x1080@59.94Hz,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$menu = wofi --show drun
$browser = brave-browser
$wob = /tmp/wobpipe

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = if [[ -z $wob ]]; then mkfifo $wob fi
exec-once = hyprpaper & waybar & nm-applet & tail -f $wob | wob # & eww


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 9
    gaps_workspaces = 144

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(444444ee) rgba(888888ee) 45deg
    col.inactive_border = rgba(222222aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    extend_border_grab_area = 30
    hover_icon_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    # layout = dwindle
    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.7

    drop_shadow = false
    shadow_range = 2
    shadow_render_power = 3
    col.shadow = rgba(000000ff)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = overshoot, 0.2, -0.6, 0.1, 1.2

    animation = windows, 1, 3, overshoot
    animation = windowsOut, 1, 5, overshoot, popin 150%
    animation = border, 1, 5, overshoot
    animation = borderangle, 1, 30, overshoot
    animation = fade, 1, 3, overshoot
    animation = workspaces, 1, 3, overshoot
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#dwindle {
#    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#    preserve_split = true # You probably want this
#}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
    mfact = 0.65
    orientation = center
    no_gaps_when_only = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    enable_swallow = true
    swallow_regex = Alacritty
    swallow_exception_regex = .*wev.*
}

binds {
    workspace_back_and_forth = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.4 # -1.0 - 1.0, 0 means no modification.
    repeat_delay = 500
    repeat_rate = 50

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$scripts = ~/bin

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bindd = $mainMod, Q, Kill active tile, killactive,
bindd = $mainMod, W, Toggle float, togglefloating,
bindd = $mainMod, E, Lock screen, exec, hyprlock
bindd = $mainMod CTRL, E, Exit hyprland, exit,
# Example special workspace (scratchpad)
bindd = $mainMod, R, Show special workspace, togglespecialworkspace, magic
bindd = $mainMod SHIFT, R, Move to special workspace, movetoworkspace, special:magic
bindd = $mainMod, T, Show this help, exec, $scripts/bind_help

# Trying a "linesplit?"
bindd = ,_,"placeholder",exec,

bindd = $mainMod, A, Open terminal, exec, $terminal
bindd = $mainMod, S, Open Browser, exec, $browser --profile-directory=Default
bindd = $mainMod SHIFT, S, Open Browser (choose), exec, $browser 
bindd = $mainMod CTRL, S, Open Browser incognito, exec, $browser --incognito
bindd = $mainMod, D, Open wofi, exec, $menu
bindd = $mainMod, F, Open files, exec, $fileManager

# Print screen in different ways
bindd = $mainMod, P, Print screen, exec, slurp | grim -g -
bindd = $mainMod SHIFT, P, Print screen to clipboard, exec, slurp | grim -g - | wl-copy
bindd = $mainMod CTRL, P, Print tile, exec, $scripts/screenshot_window

# Trying a "linesplit?"
bindd = ,_,"placeholder",exec,

# Move focus with mainMod + arrow keys
bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, J, Focus down, movefocus, d

# Move active window
bindd = $mainMod SHIFT, H, Move left, movewindow, l
bindd = $mainMod SHIFT, L, Move right, movewindow, r
bindd = $mainMod SHIFT, K, Move up, movewindow, u
bindd = $mainMod SHIFT, J, Move down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = , mouse:275, workspace, e+1
bind = , mouse:276, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $scripts/wob_help -wsa incr
bindel = ,XF86AudioLowerVolume, exec, $scripts/wob_help -wsa decr
bindel = ,XF86AudioMute, exec, $scripts/wob_help -wsa mute
bindel = ,XF86MonBrightnessUp, exec, $scripts/wob_help -wsa brighter
bindel = ,XF86MonBrightnessDown, exec, $scripts/wob_help -wsa darker

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# show bind help as temp popover
windowrulev2 = float,center,opacity 0.5 override,class:bind_help
windowrulev2 = center,class:bind_help
windowrulev2 = opacity 0.75 override,class:bind_help
windowrulev2 = stayfocused,class:bind_help
